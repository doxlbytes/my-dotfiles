general {
    hide_cursor = false
    immediate_render = false
    screencopy_mode = 1
    fail_timeout = 3000
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
    noise = 0.01
    contrast = 1
    brightness = 1
    vibrancy = 0
}

label {
    monitor =
    text = cmd[update:1000] date '+%H'
    color = rgba(ffffffff)
    font_size = 76
    font_family = JetBrains Mono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date '+%M'
    color = rgba(ffffffff)
    font_size = 76
    font_family = JetBrains Mono Nerd Font
    position = 0, 38
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A'
    color = rgba(ffffffff)
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    position = 0, -32
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%d %b'
    color = rgba(ffffffff)
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    position = 0, -58
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 270, 46

    outline_thickness = 1
    outer_color = rgba(ffffffff)
    inner_color = rgba(00000000)
    font_color = rgba(ffffffff)

    dots_size = 0.22
    dots_spacing = 0.19
    dots_center = true
    dots_rounding = -1

    fade_on_empty = false
    rounding = 23

    position = 0, -210
    halign = center
    valign = center
}