

$font = JetBrainsMono Nerd Font

# BACKGROUND
background {
    monitor =
    path = /home/doxl/Pictures/Wallpapers/wallhaven-ox8pl5.jpg

    blur_size = 4
    blur_passes = 2
    noise = 0.0
    contrast = 0.9
    brightness = 0.45
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# DARK OVERLAY
shape {
    monitor =
    size = 100%, 100%
    color = rgba(0, 0, 0, 0.58)
    rounding = 0

    position = 0, 0
    halign = center
    valign = center
}

# TERMINAL COMMAND
label {
    monitor =
    text = ❯ date
    color = rgba(168, 168, 168, 1.0)
    font_size = 14
    font_family = $font

    position = 0, 115
    halign = center
    valign = center
}

# CURRENT DATE
label {
    monitor =
    text = cmd[update:60000] date '+%a %d %b %Y'
    color = rgba(228, 228, 228, 1.0)
    font_size = 16
    font_family = $font

    position = 0, 82
    halign = center
    valign = center
}

# USER PROMPT
label {
    monitor =
    text = ~ doxl
    color = rgba(228, 228, 228, 1.0)
    font_size = 15
    font_family = $font

    position = 0, 15
    halign = center
    valign = center
}

# PASSWORD PROMPT
label {
    monitor =
    text = Password:
    color = rgba(168, 168, 168, 1.0)
    font_size = 14
    font_family = $font

    position = 0, -35
    halign = center
    valign = center
}

# PASSWORD INPUT
input-field {
    monitor =
    size = 260, 42
    outline_thickness = 1

    dots_size = 0.20
    dots_spacing = 0.25
    dots_center = false
    dots_rounding = 0

    outer_color = rgba(48, 48, 48, 1.0)
    inner_color = rgba(32, 32, 32, 0.88)
    font_color = rgba(228, 228, 228, 1.0)
    check_color = rgba(168, 168, 168, 1.0)
    fail_color = rgba(168, 168, 168, 1.0)

    placeholder_text = 
    fail_text = Authentication failed

    rounding = 0
    fade_on_empty = false
    shadow_passes = 0

    position = 0, -90
    halign = center
    valign = center
}
